name: Production Release

# Release gate.
#
# Production is hosted on Vercel with `release` as its Production Branch, so
# merging to `main` only produces preview deployments. Pushing a `v*` tag runs
# this workflow, which:
#   1. verifies the tagged commit is on `main`, passes the reduced tests, has a
#      valid Supabase config, and builds (job: build), then
#   2. fast-forwards the `release` branch to the tagged commit, which makes
#      Vercel deploy it to production, and waits for that deployment (job: promote).
# On success the accessibility scan of the live site runs (see a11y-scan.yml).
# See VERCEL_DEPLOYMENT.md.
on:
  # Run when a version tag is pushed (e.g. v1.2.3).
  push:
    tags:
      - "v*"
  # Manual runs only verify and re-trigger the accessibility scan; they never promote.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "production-release"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure release tag points to main
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/main"; then
            echo "Tag ${GITHUB_REF_NAME} is not reachable from origin/main; refusing production release."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu @swc/core-linux-x64-gnu

      - name: Validate Supabase URL/key pairing
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node -e "
            const url = (process.env.VITE_SUPABASE_URL || '').trim();
            const key = (process.env.VITE_SUPABASE_ANON_KEY || '').trim();
            if (!url || !key) {
              console.error('Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY');
              process.exit(1);
            }

            const normalizedUrl = url.replace(/\/$/, '');

            // Validate via a real auth endpoint so both JWT and non-JWT key
            // formats are supported (Supabase may issue either format).
            const endpoint = normalizedUrl + '/auth/v1/settings';

            fetch(endpoint, {
              headers: {
                apikey: key,
                Authorization: 'Bearer ' + key,
              },
            }).then(async (res) => {
              if (!res.ok) {
                const body = await res.text().catch(() => '');
                console.error('Supabase URL/key validation failed.');
                console.error('Endpoint:', endpoint);
                console.error('Status:', res.status, res.statusText);
                console.error('Body:', body.slice(0, 500));
                process.exit(1);
              }
              console.log('Supabase URL/key pair looks consistent.');
            }).catch((err) => {
              console.error('Supabase URL/key validation request failed:', err);
              process.exit(1);
            });
          "

      - name: Run tests (reduced suite)
        env:
          CI: true
        run: npm run test:run:reduced

      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VITE_APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build production bundle
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_DEV_MODE: ${{ secrets.VITE_DEV_MODE }}
          VITE_LOG_LEVEL: ${{ secrets.VITE_LOG_LEVEL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:ghpages:ci

  promote:
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the `release` branch
      deployments: read # read Vercel's deployment status
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Fast-forward only: this fails if the tag is older than what is already
      # on `release`. To roll back, promote an earlier deployment in Vercel.
      - name: Fast-forward release branch to the tagged commit
        run: |
          # Remember when we pushed (minus a little clock-skew slack) so the next
          # step ignores earlier production deploys of this same commit.
          echo "PUSH_START=$(date -u -d '30 seconds ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          git push origin "${GITHUB_SHA}:refs/heads/release"

      - name: Wait for Vercel production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${GITHUB_REPOSITORY}"
          for i in $(seq 1 60); do
            id=$(gh api "repos/${repo}/deployments?sha=${GITHUB_SHA}&environment=Production" \
              --jq "[.[] | select(.created_at >= \"${PUSH_START}\")][0].id // empty")
            if [ -n "$id" ]; then
              state=$(gh api "repos/${repo}/deployments/${id}/statuses" --jq '.[0].state // "pending"')
              echo "Production deployment ${id}: ${state}"
              case "$state" in
                success) exit 0 ;;
                failure|error|inactive) echo "Vercel production deployment did not succeed."; exit 1 ;;
              esac
            else
              echo "Waiting for Vercel to start the production deployment..."
            fi
            sleep 10
          done
          echo "::warning::Timed out waiting for the Vercel production deployment; the accessibility scan may run against the previous version."
